source: >-
  Live probes of University of Michigan hosts and of the external registries that hold U-M's
  machine-readable membership records, 2026-08-19. Every entry below cites a URL that was
  fetched and a status code that was observed.
regime: education
note: >-
  Scored against the Kin Score `education` regime standards list (scim, lti, oneroster, ed-fi,
