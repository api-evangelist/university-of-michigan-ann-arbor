  - id: datacite
    conforms: true
    operator: institution
    evidence: >-
      University of Michigan Library is a DataCite direct member. GET
      https://api.datacite.org/providers/umich -> 200 application/vnd.api+json; symbol UMICH,
      name "University of Michigan Library", memberType direct_member, created 2018-11-21,
      rorId https://ror.org/00jmfr291. Five repositories are registered under it — UMICH.LIBRARY,
