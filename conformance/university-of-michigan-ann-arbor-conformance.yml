standards:
  - id: oai-pmh
    conforms: true
    operator: institution
    evidence: >-
      OAI-PMH 2.0 confirmed live on a U-M host. GET
      https://backend.production.deepblue-documents.lib.umich.edu/server/oai/request?verb=Identify
      -> 200 text/xml, protocolVersion 2.0, repositoryName "Deep Blue", repositoryIdentifier
      "deepblue.lib.umich.edu", adminEmail deepblue@umich.edu, earliestDatestamp
      2005-08-29T23:07:21Z, granularity YYYY-MM-DDThh:mm:ssZ, deletedRecord transient. All six
      verbs returned 200 (Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords,
