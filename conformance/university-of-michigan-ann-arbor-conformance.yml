      verbatim at authentication/university-of-michigan-ann-arbor-shibboleth-idp-metadata.xml.
  - id: saml
    conforms: true
    operator: institution
    evidence: >-
      SAML 2.0 metadata. The same document is a
      urn:oasis:names:tc:SAML:2.0:metadata EntityDescriptor with
      entityID="https://shibboleth.umich.edu/idp/shibboleth" and an IDPSSODescriptor with
      protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol", signing and encryption
      KeyDescriptors, and SingleSignOnService / SingleLogoutService endpoints. Registration
