      prefixes. Captures in examples/, described in
      openapi/university-of-michigan-ann-arbor-deep-blue-documents-oai-pmh-openapi.yml.
  - id: shibboleth
    conforms: true
    operator: institution
    evidence: >-
      U-M operates its own Shibboleth Identity Provider. GET
      https://shibboleth.umich.edu/idp/shibboleth -> 200 application/xml;charset=UTF-8, 10,923
      bytes. Document carries the Shibboleth-specific metadata extension
      xmlns:shibmd="urn:mace:shibboleth:metadata:1.0" with shibmd:Scope entries for umich.edu,
      annarbor.umich.edu, umd.umich.edu, dearborn.umich.edu and flint.umich.edu. Same document
