  - aid: university-of-michigan-ann-arbor:deep-blue-documents-oai
    name: Deep Blue Documents OAI-PMH
    x-operator: institution
    x-operator-evidence: >-
      Host backend.production.deepblue-documents.lib.umich.edu is under umich.edu. Identify
      returns repositoryName "Deep Blue", repositoryIdentifier "deepblue.lib.umich.edu",
      adminEmail deepblue@umich.edu. The software is DSpace (open source); the deployment,
      host, content and administrative contact are the University of Michigan Library's.
    description: >-
      Live OAI-PMH 2.0 metadata harvesting endpoint for Deep Blue Documents, the University of
      Michigan Library's DSpace institutional repository of articles, dissertations, theses and
      archival collections. All six protocol verbs were probed live on 2026-08-19 and all
      returned HTTP 200: Identify, ListMetadataFormats (12 prefixes — oai_dc, qdc, mods, mets,
      marc, rdf, ore, didl, dim, xoai, etdms, uketd_dc), ListSets (726 sets), ListIdentifiers,
      ListRecords and GetRecord. Unauthenticated and open. Records go back to 2005-08-29.
      Protocol errors are returned with HTTP 200 inside the envelope — four error codes
      (badVerb, badArgument, cannotDisseminateFormat, idDoesNotExist) were reproduced against
      this host. The University of Michigan does not publish an OpenAPI description of this
      endpoint; the one in this repo was written by API Evangelist from those probes.
