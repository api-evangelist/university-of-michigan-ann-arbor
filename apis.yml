x-coverage:
  state: gated
  reason: institution_api_estate_behind_sso
  detail: >-
    U-M's programmable footprint is real and mostly unreachable, for two different reasons that
    must not be conflated. FIRST, and this is the finding about the institution: the enterprise
    API estate — MCommunity, Schedule of Classes, class rosters, room scheduling — lives in the
    ITS API Directory on Apigee X and requires a U-M uniqname, Duo two-factor authentication and
    U-M network/VPN presence to even browse. There is no public developer registration path, so
    no endpoint in it could be probed or described, and none has been. SECOND, and this is a
    limit on us rather than on them: most of the umich.edu estate sits behind a Cloudflare
    managed challenge and returns HTTP 403 "Just a moment..." to automated clients — umich.edu,
    its.umich.edu, documentation.its.umich.edu, deepblue.lib.umich.edu, search.lib.umich.edu,
    arc.umich.edu, genai.umich.edu, safecomputing.umich.edu, ro.umich.edu and
    www.icpsr.umich.edu among them. Those pointers are live and real; they are just not readable
    by us, and they should be re-probed with a browser-grade client. Deep Blue Data in
    particular is a documented public REST API that we could not read, so no contract was
    written for it. What WAS fully readable is genuinely U-M's and is described here in full:
    the Deep Blue Documents OAI-PMH endpoint (all six verbs, twelve metadata formats, 726 sets,
    four error codes reproduced) and the U-M Shibboleth SAML 2.0 identity provider registered in
    InCommon. One vendor tenancy is recorded rather than absorbed: Canvas at
    umich.instructure.com. A suspected Figshare tenancy at umich.figshare.com was REJECTED — a
    nonsense control subdomain returns the identical AWS WAF 202, so the response is a wildcard
    artefact and not evidence of a U-M account.
