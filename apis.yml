    name: Canvas LMS (U-M tenancy on Instructure)
    x-operator: tenant
    x-operator-evidence: >-
      umich.instructure.com is a U-M-specific account on Instructure's platform, not a U-M
      host. GET /api/v1/accounts returns 401 with Canvas's own error envelope
      ({"status":"unauthenticated"}) and /login returns 200 titled "U-M Canvas Login". A
      nonsense tenant on the same platform (zzznotarealtenant.instructure.com) returns 404, so
      the U-M tenancy is real and not a wildcard artefact.
    description: >-
      The University of Michigan's Canvas learning management system tenancy. The courses, the
      enrollments and the data are U-M's; the API contract is Instructure's, published once for
      every Canvas customer, and it is deliberately NOT stored in this repo. This entry records
      the relationship — which is a real institutional fact and one of U-M's few programmable
      surfaces — without crediting U-M with Instructure's engineering. Score the contract
      against Instructure.
    humanURL: https://umich.instructure.com/login
    baseURL: https://umich.instructure.com/api/v1
