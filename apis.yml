      mdrpi:RegistrationInfo registrationAuthority="https://incommon.org".
    description: >-
      The University of Michigan's own Shibboleth SAML 2.0 identity provider, and the most
      unambiguously institution-operated machine-readable surface U-M publishes. GET
      https://shibboleth.umich.edu/idp/shibboleth returns 200 application/xml (10,923 bytes) —
      an IDPSSODescriptor with protocolSupportEnumeration urn:oasis:names:tc:SAML:2.0:protocol,
      signing and encryption key descriptors, SSO and SLO endpoints, and shibmd:Scope entries
      for umich.edu, annarbor.umich.edu, umd.umich.edu, dearborn.umich.edu and flint.umich.edu.
      Registered in InCommon and therefore reachable through eduGAIN. U-M ITS Identity and
      Access Management publishes working SAML and OIDC service-provider integration examples
      publicly at github.com/umich-iam. This is federation metadata, not a REST API — there is
      no OpenAPI to write and none has been invented.
