  - aid: university-of-michigan-ann-arbor:shibboleth-idp
    name: U-M Shibboleth Identity Provider (InCommon)
    x-operator: institution
    x-operator-evidence: >-
      shibboleth.umich.edu and weblogin.umich.edu are under umich.edu and serve a SAML 2.0
      EntityDescriptor with entityID https://shibboleth.umich.edu/idp/shibboleth. InCommon's
