    description: >-
      Enterprise API directory and gateway operated by U-M Information and Technology Services
      on Google Apigee X (migrated from IBM API Connect v5 in 2024), exposing institutional data
      APIs across teaching and learning, research, clinical care, public service and
      administration — MCommunity directory APIs, Schedule of Classes, class rosters and room
      scheduling among them. It is closed: browsing, subscribing to or calling anything in it
      requires a U-M uniqname and password, Duo two-factor authentication, and presence on the
      U-M network or VPN. No anonymous probe of any endpoint was possible and no API in the
      directory is described here. The credential shape is visible in U-M Library's own
      open-source client, mlibrary/class_api_requester, which is constructed with an API id, an
      API secret, an API URL and a separate token URL.
