aid: university-of-michigan-ann-arbor
name: University of Michigan-Ann Arbor
x-type: university
x-category: Public Research University
description: >-
  The University of Michigan-Ann Arbor is a public research university (QS World University
  Rankings 2025 #20-21, United States), a member of the Association of American Universities
  and the Big Ten Academic Alliance. Its programmable footprint is large in aggregate and
  almost entirely closed to the public. The enterprise estate — MCommunity directory, Schedule
  of Classes, class rosters, room scheduling and other institutional data — sits behind the
  U-M ITS API Directory on Google Apigee X, which cannot be browsed, let alone called, without
  a U-M uniqname, Duo two-factor authentication and presence on the U-M network or VPN. What is
  genuinely open and genuinely U-M's own is library and identity infrastructure: the Deep Blue
  Documents DSpace repository publishes a fully working OAI-PMH 2.0 harvesting endpoint on a
  umich.edu host (all six verbs verified live, twelve metadata formats, 726 sets, records back
  to 2005), and U-M ITS Identity and Access Management operates its own Shibboleth SAML 2.0
  identity provider registered in InCommon, with public SAML and OIDC integration examples on
  GitHub. U-M Library is a DataCite direct member (symbol UMICH, five repositories) and a
  Crossref member (prefix 10.3998). Around those sit smaller institution-run surfaces — the
  Magic Bus transit API and Deep Blue Data — and one large vendor tenancy, Canvas at
  umich.instructure.com, whose contract belongs to Instructure and is not stored here. U-M
  publishes no public developer portal, no OpenAPI, no changelog and no API terms of service.
  Most of the umich.edu estate returns a Cloudflare bot challenge to automated clients, so
  several pointers below are documented-and-live rather than machine-readable.
